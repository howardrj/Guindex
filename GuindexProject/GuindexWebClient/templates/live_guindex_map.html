{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guindex Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        #map_status {
            position: absolute;
            z-index: 1000;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .guindex-map-marker {
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        }
        .guindex-map-marker-red { background: #d9534f; }
        .guindex-map-marker-black { background: #222; }
        .guindex-map-marker-green { background: #5cb85c; }
        .guindex-map-marker-darkgray { background: #777; }
    </style>
</head>
<body>
    <div id="map_status">Loading pubs...</div>
    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
    <script>
        window.GUINDEX_MAP_CONFIG = {
            centerLat: {{ map_center_lat }},
            centerLng: {{ map_center_lng }},
            zoom: {{ map_zoom }},
            apiUrl: "{{ map_api_url }}"
        };
    </script>
    <script src="{% static 'javascript/guindex_live_map.js' %}"></script>
</body>
</html>
