{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guindex Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css"/>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        #map_status {
            position: absolute;
            z-index: 1000;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 14px;
            max-width: 90%;
            text-align: center;
        }
        .guindex-map-popup {
            font-family: sans-serif;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="map_status">Select a county to view pubs on the map.</div>
    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <script>
        window.GUINDEX_MAP_CONFIG = {
            centerLat: {{ map_center_lat }},
            centerLng: {{ map_center_lng }},
            zoom: {{ map_zoom }},
            apiUrl: "{{ map_api_url }}",
            countyViewports: {{ county_viewports_json|safe }},
            loadOnStart: {{ load_on_start_json|safe }},
            initialCounty: {{ initial_county_json|safe }}
        };
    </script>
    {% if not debug %}
    <script src="{% static 'javascript/guindex_live_map.min.js' %}"></script>
    {% else %}
    <script src="{% static 'javascript/guindex_live_map.js' %}"></script>
    {% endif %}
</body>
</html>
